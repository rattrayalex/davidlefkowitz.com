name: Deploy to Cloudflare Pages

# Pushes to main build the static site and publish it to the live
# davidlefkowitz.com. The Cloudflare Pages project 'davidlefkowitz' has
# main as its production branch, which is why wrangler is passed
# --branch main below; a different name would create a preview
# deployment instead of updating the live site.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          pip3 install --quiet pillow

      - name: Build static site
        run: bash scripts/build-site.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name davidlefkowitz --branch main --commit-dirty=true
